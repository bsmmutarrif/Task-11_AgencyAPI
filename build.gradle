plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation'org.springframework.security:spring-security-oauth2-client'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.keycloak:keycloak-spring-boot-starter:21.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Spring Security OAuth2 Resource Server
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Optional: Spring Boot Starter Security for general security configuration
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Optional: JSON Web Token (JWT) processing library (included transitively by resource server)
	implementation 'com.nimbusds:nimbus-jose-jwt:9.31' // Update version if necessary
}

tasks.named('test') {
	useJUnitPlatform()
}
